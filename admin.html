<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

  <!-- TELA DE LOGIN -->
  <div class="login-box" id="login-box">
    <h2>Login Admin</h2>
    <input type="email" id="login-email" placeholder="E-mail">
    <input type="password" id="login-senha" placeholder="Senha">
    <button id="login-btn" style="width:100%">Entrar</button>
    <div id="login-msg"></div>
  </div>

  <!-- PAINEL -->
  <div class="admin-wrap" id="painel" style="display:none">
    <button id="logout-btn">Sair</button>
    <h1>Painel Admin</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="respostas">1 - Respostas</button>
      <button class="tab-btn" data-tab="editar">2 - Editar</button>
      <button class="tab-btn" data-tab="contas">3 - Contas</button>
    </div>

    <!-- ABA 1: RESPOSTAS -->
    <div class="tab-content active" id="tab-respostas">
      <h3>Respostas recebidas</h3>
      <div id="lista-respostas">Carregando...</div>
    </div>

    <!-- ABA 2: EDITAR -->
    <div class="tab-content" id="tab-editar">
      <h3>Editar página inicial</h3>

      <div class="form-row">
        <label>Pergunta</label>
        <input type="text" id="edit-pergunta">
      </div>

      <div class="form-row">
        <label>Aviso (mostrado após enviar resposta)</label>
        <input type="text" id="edit-aviso">
      </div>

      <div class="form-row">
        <label>Wallpaper (imagem de fundo)</label>
        <input type="file" id="edit-wallpaper-file" accept="image/*">
        <p class="subtitle" id="wallpaper-atual"></p>
      </div>

      <div class="form-row">
        <label>Música de fundo</label>
        <input type="file" id="edit-musica-file" accept="audio/*">
        <p class="subtitle" id="musica-atual"></p>
      </div>

      <button id="salvar-config-btn">Salvar alterações</button>
      <div id="editar-msg"></div>
    </div>

    <!-- ABA 3: CONTAS -->
    <div class="tab-content" id="tab-contas">
      <h3>Contas Roblox</h3>

      <div class="form-row">
        <label>Nick</label>
        <input type="text" id="conta-nick">
      </div>
      <div class="form-row">
        <label>Senha</label>
        <input type="text" id="conta-senha">
      </div>
      <div class="form-row">
        <label>E-mail</label>
        <input type="text" id="conta-email">
      </div>
      <div class="form-row">
        <label>Observação</label>
        <textarea id="conta-obs"></textarea>
      </div>
      <button id="add-conta-btn">Adicionar conta</button>

      <hr style="margin:24px 0; border-color:#333">

      <div id="lista-contas">Carregando...</div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
